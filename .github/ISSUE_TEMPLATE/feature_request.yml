name: Feature Request
description: Suggest an improvement or new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve the RAG system? We'd love to hear it.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem or limitation are you facing?
      placeholder: "I'm trying to do X but..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system does this relate to?
      options:
        - Embeddings / TF-IDF
        - Vector search
        - RAG chain
        - LLM providers
        - Session management
        - API / HTTP layer
        - Configuration
        - Knowledge base ingestion
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative approaches?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, references, or examples.
